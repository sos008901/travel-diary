<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Travel Assistant</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { theme: { main: '#2C3032', accent: '#C5A059', bg: '#F4F2EE' } } } } }
    </script>
</head>
<body>
<div id="app" v-cloak>
    <div id="app-container">
        <header class="p-6 pb-2">
            <h1 class="text-4xl font-serif font-medium tracking-widest text-theme-main">{{ destination || 'Journey' }}</h1>
        </header>

        <main class="flex-1 overflow-y-auto">
            <div v-if="currentTab === 'schedule'" class="p-5">
                <div class="flex overflow-x-auto no-scrollbar space-x-3 mb-6">
                    <button v-for="(day, index) in days" :key="index" @click="currentDayIndex = index" 
                        :class="['flex-shrink-0 px-4 py-3 rounded-3xl border min-w-[5.8rem] transition-all', currentDayIndex === index ? 'bg-theme-main text-white' : 'bg-white text-gray-500']">
                        <span class="text-[8px] uppercase block opacity-70">Day {{ index + 1 }}</span>
                        <span class="text-xs font-serif font-bold">{{ getDayDate(index) }}</span>
                    </button>
                </div>

                <div class="space-y-4">
                    <div v-for="item in currentDayItems" :key="item.id" class="bg-white p-5 rounded-3xl shadow-sm border-l-4 border-theme-main" @click="toggleExpand(item.id)">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-xs font-bold text-theme-accent mr-2">{{ item.time }}</span>
                                <h3 class="inline text-lg font-serif font-bold">{{ item.title }}</h3>
                            </div>
                        </div>
                        <div v-if="expandedItemId === item.id" class="mt-3 text-sm text-gray-600 border-t pt-3 border-dashed">
                            {{ item.note || '無備註' }}
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <button @click="onFabClick" class="fab-btn"><i class="fas fa-plus"></i></button>

        <nav class="glass-panel flex justify-around items-center h-20">
            <button @click="currentTab='schedule'" :class="currentTab==='schedule'?'text-theme-accent':'text-theme-sub'">
                <i class="fas fa-map-marked-alt block text-xl mb-1"></i>
                <span class="text-[9px] uppercase tracking-widest">Schedule</span>
            </button>
            <button @click="currentTab='money'" :class="currentTab==='money'?'text-theme-accent':'text-theme-sub'">
                <i class="fas fa-wallet block text-xl mb-1"></i>
                <span class="text-[9px] uppercase tracking-widest">Budget</span>
            </button>
        </nav>
    </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
