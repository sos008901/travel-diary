<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Travel Assistant (雲端版)</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#F4F2EE">

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Cinzel:wght@500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        display: ['"Cinzel"', '"Noto Serif TC"', 'serif'],
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        theme: { 
                            main: '#2C3032', sub: '#5F6368', accent: '#C5A059', bg: '#F4F2EE', white: '#FFFFFF', border: '#E0E0E0', danger: '#A65652', input: '#F0F2F2'
                        }
                    },
                    boxShadow: { float: '0 15px 30px -5px rgba(0, 0, 0, 0.1)', soft: '0 4px 20px -5px rgba(197, 160, 89, 0.15)', },
                    spacing: { 'safe-top': 'env(safe-area-inset-top)', 'safe-bottom': 'env(safe-area-inset-bottom)' },
                    borderRadius: { 'xl': '1rem', '2xl': '1.5rem', '3xl': '2rem', }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" v-cloak>
    <div id="app-container" class="bg-washi relative w-full h-full">
        
        <div class="cloud-status" :class="{ 'syncing': isSyncing, 'error': permissionError }">
            <template v-if="permissionError">
                 <i class="fas fa-exclamation-triangle"></i> <span>權限錯誤 (請檢查設定)</span>
            </template>
            <template v-else>
                 <i class="fas fa-cloud"></i> <span v-if="isSyncing">Syncing...</span>
            </template>
        </div>

        <transition enter-active-class="transition duration-300 ease-out" enter-from-class="opacity-0 -translate-y-4" enter-to-class="opacity-100 translate-y-0" leave-active-class="transition duration-200 ease-in" leave-from-class="opacity-100" leave-to-class="opacity-0">
            <div v-if="toast.show" class="fixed top-safe-top left-0 w-full flex justify-center pt-4 z-[2000] pointer-events-none">
                <div class="bg-theme-main text-white px-6 py-3 rounded-full shadow-xl flex items-center space-x-3 border border-theme-accent/30">
                    <span class="text-theme-accent text-lg">●</span><span class="text-xs tracking-widest font-serif">{{ toast.message }}</span>
                </div>
            </div>
        </transition>
        
        <transition enter-active-class="transition duration-300 ease-out" enter-from-class="opacity-0" enter-to-class="opacity-100" leave-active-class="transition duration-200 ease-in" leave-from-class="opacity-100" leave-to-class="opacity-0">
            <div v-if="viewingImage" class="fixed inset-0 z-[3000] bg-black/90 flex items-center justify-center p-4" @click="viewingImage = null">
                <img :src="viewingImage" class="max-w-full max-h-full rounded-lg shadow-2xl object-contain">
            </div>
        </transition>

        <div v-if="showWizard" class="fixed inset-0 z-[1500] bg-[#2C3032] overflow-y-auto text-white animate-fade-in no-scrollbar">
            <div class="min-h-full flex flex-col items-center justify-center p-6 relative z-10">
                <div class="w-full max-w-sm flex flex-col items-center">
                    <h1 class="text-6xl font-serif font-medium mb-8 tracking-widest text-white">栞</h1>
                    <div class="space-y-6 w-full px-4 text-center">
                        <input v-model="tempDestination" placeholder="Kyoto" class="w-full bg-transparent border-b border-gray-600 py-2 text-center text-xl font-serif text-white focus:border-theme-accent outline-none">
                        <input type="date" v-model="tempStartDate" class="w-full bg-transparent border-b border-gray-600 py-2 text-center text-lg font-sans text-white outline-none">
                        <button @click="finishWizard" class="w-full py-4 mt-6 bg-theme-accent text-[#1A1C1C] font-bold rounded-xl active:scale-95 transition-all">START JOURNEY</button>
                    </div>
                </div>
            </div>
        </div>

        <template v-else>
            <header class="glass-panel pt-[calc(env(safe-area-inset-top)+40px)] px-6 pb-5 z-40 sticky top-0 flex justify-between items-end shadow-sm h-[calc(140px+env(safe-area-inset-top))] bg-[#F4F2EE]">
                <div class="flex-1 min-w-0 mr-4 relative pb-1">
                    <div class="pl-3 border-l-2 border-theme-accent/80 flex flex-col justify-end">
                        <p class="text-[10px] text-gray-400 font-sans font-bold uppercase tracking-[0.25em] mb-1.5 leading-none">Destination</p>
                        <h1 class="text-4xl font-serif font-medium tracking-widest text-theme-main leading-none overflow-visible whitespace-nowrap">{{ destination }}</h1>
                    </div>
                </div>
                <button @click="showSettingsModal = true" class="btn-base icon-btn mb-2"><i class="fas fa-cog"></i></button>
            </header>

            <main class="flex-1 overflow-y-auto overflow-x-hidden pb-40 relative bg-washi">
                <div v-if="currentTab === 'schedule'" class="p-5 min-h-full">
                    <div class="sticky top-0 z-30 py-3 -mx-5 px-5 bg-[#F4F2EE]/80 backdrop-blur-sm mb-6">
                        <div class="flex items-center justify-between">
                            <div ref="dateContainer" class="flex-1 overflow-x-auto no-scrollbar flex space-x-3 py-1">
                                <button v-for="(day, index) in days" :key="index" @click="currentDayIndex = index" 
                                    :class="['snap-center flex-shrink-0 px-5 py-3 border transition-all flex flex-col items-center min-w-[6.5rem] relative rounded-3xl', currentDayIndex === index ? 'bg-theme-main text-white' : 'bg-white text-theme-sub border-transparent shadow-sm']">
                                    <span class="text-[8px] tracking-widest uppercase opacity-80 mb-1">Day {{ index + 1 }}</span>
                                    <span class="text-sm font-serif font-bold">{{ getDayDate(index) }}</span>
                                </button>
                            </div>
                            <div class="flex space-x-2 pl-3 border-l ml-2">
                                <button @click.stop="confirmDeleteDay" class="icon-btn-danger"><i class="fas fa-minus"></i></button>
                                <button @click.stop="addDay" class="icon-btn-primary"><i class="fas fa-plus"></i></button>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-5">
                        <div v-for="(item, idx) in currentDayItems" :key="item.id" class="bg-white p-5 shadow-sm border-l-4 border-theme-main relative rounded-3xl flex items-start gap-1" @click.stop="toggleExpand(item.id)">
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-start">
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-baseline mb-1">
                                            <span class="text-xs font-bold text-theme-accent mr-3">{{ item.time }}</span>
                                            <h3 class="text-lg font-serif font-bold text-theme-main tracking-wide">{{ item.title }}</h3>
                                        </div>
                                        <div v-if="item.location" class="flex items-center text-xs text-gray-500 underline decoration-dotted" @click.stop="openMap(item.location)">
                                            <i class="fas fa-map-marker-alt mr-1.5"></i>{{ item.location }}
                                        </div>
                                    </div>
                                    <button @click.stop="confirmDeleteItem(item.id)" class="text-gray-300 p-2"><i class="fas fa-times"></i></button>
                                </div>
                                <div v-if="expandedItemId === item.id && item.note" class="mt-4 pt-3 border-t border-dashed border-gray-200 text-sm text-gray-600 leading-relaxed whitespace-pre-wrap">{{ item.note }}</div>
                                <button @click.stop="editItem(item)" class="absolute right-4 bottom-4 text-gray-300 opacity-0 group-hover:opacity-100 transition"><i class="fas fa-pen text-xs"></i></button>
                            </div>
                        </div>
                    </div>
                </div>

                <div v-if="currentTab === 'money'" class="p-5">
                    <div class="bg-theme-main text-white p-8 rounded-3xl shadow-xl mb-8 text-center">
                        <p class="text-[10px] tracking-[0.4em] text-theme-accent uppercase mb-4">Grand Total</p>
                        <h2 class="text-5xl font-serif mb-2">{{ currencySymbol }} {{ totalExpense.toLocaleString() }}</h2>
                        <p class="text-xs opacity-60">≈ NT$ {{ toTWD(totalExpense) }}</p>
                        <button @click.stop="openTravelerModal" class="absolute top-4 right-4 w-8 h-8 bg-white/10 rounded-full flex items-center justify-center hover:bg-white/20 transition cursor-pointer"><i class="fas fa-users text-white"></i></button>
                    </div>
                    
                    <div class="grid grid-cols-1 gap-4 pb-4">
                        <div v-for="t in travelers" :key="t" class="bg-white p-5 shadow-sm border-b border-gray-100 flex justify-between items-center rounded-3xl">
                             <div class="flex items-center gap-3">
                                 <div class="w-10 h-10 rounded-full bg-theme-input flex items-center justify-center font-bold text-theme-sub">{{ t[0] }}</div>
                                 <span class="font-bold text-theme-main">{{ t }}</span>
                             </div>
                             <div class="text-right">
                                 <span class="block font-bold text-theme-main font-display text-xl">{{ currencySymbol }} {{ Math.round(getMemberDetails(t).total).toLocaleString() }}</span>
                                 <span class="block text-[10px] text-gray-400">≈ NT$ {{ toTWD(getMemberDetails(t).total) }}</span>
                             </div>
                        </div>
                    </div>

                    <div v-for="group in groupedExpenses" :key="group.date" class="space-y-2 mb-4">
                        <div class="flex justify-between items-end px-2 border-b border-dashed border-gray-200 pb-2">
                             <h4 class="text-xs font-bold text-theme-sub tracking-widest uppercase">{{ group.displayDate }}</h4>
                             <span class="text-sm font-serif font-bold text-theme-main">{{ currencySymbol }}{{ group.total.toLocaleString() }}</span>
                        </div>
                        <div v-for="exp in group.items" :key="exp.id" class="bg-white p-4 shadow-sm rounded-2xl flex justify-between items-center" @click="editExpense(exp)">
                            <div class="flex-1 min-w-0 pr-4">
                                <h4 class="font-bold text-theme-main text-sm mb-1 truncate">{{ exp.title }}</h4>
                                <div class="text-[10px] text-gray-400">{{ exp.payer }} 付款</div>
                            </div>
                            <div class="text-right">
                                <span class="block font-bold text-theme-main">{{ currencySymbol }} {{ Number(exp.amount).toLocaleString() }}</span>
                                <span class="block text-[9px] text-gray-400">≈ NT$ {{ toTWD(exp.amount) }}</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div v-if="currentTab === 'memo'" class="p-6">
                    <h2 class="text-2xl font-serif font-bold text-theme-main mb-6 border-b pb-4">備忘錄</h2>
                    <div class="space-y-4">
                        <div v-for="note in notes" :key="note.id" @click.stop="toggleExpandNote(note.id)" class="bg-white p-6 shadow-sm rounded-3xl">
                            <h3 class="font-bold text-theme-main text-lg">{{ note.title || '未命名' }}</h3>
                            <div v-if="expandedNoteId === note.id" class="mt-4 pt-4 border-t border-dashed text-sm text-gray-600 leading-relaxed whitespace-pre-wrap">
                                <div v-if="note.images && note.images.length > 0" class="mb-4 flex gap-2 overflow-x-auto">
                                    <img v-for="(img, i) in note.images" :key="i" :src="img" class="h-32 rounded-lg object-cover" @click.stop="viewImage(img)">
                                </div>
                                <div v-html="renderNote(note.content)"></div>
                                <button @click.stop="editNote(note)" class="mt-4 block ml-auto text-theme-accent text-xs font-bold">EDIT</button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <button @click="onFabClick" class="fab-btn"><i class="fas fa-plus"></i></button>

            <nav class="glass-panel absolute bottom-0 w-full h-[calc(80px+env(safe-area-inset-bottom))] pb-safe-bottom z-[900] flex justify-around items-center bg-[#F4F2EE]/90 backdrop-blur-lg border-t">
                <button @click="currentTab='schedule'" :class="['flex flex-col items-center flex-1', currentTab==='schedule'?'text-theme-accent':'text-theme-sub']">
                    <i class="fas fa-map-marked-alt text-xl mb-1"></i><span class="text-[9px] uppercase tracking-widest">Schedule</span>
                </button>
                <button @click="currentTab='money'" :class="['flex flex-col items-center flex-1', currentTab==='money'?'text-theme-accent':'text-theme-sub']">
                    <i class="fas fa-wallet text-xl mb-1"></i><span class="text-[9px] uppercase tracking-widest">Budget</span>
                </button>
                <button @click="currentTab='memo'" :class="['flex flex-col items-center flex-1', currentTab==='memo'?'text-theme-accent':'text-theme-sub']">
                    <i class="fas fa-book text-xl mb-1"></i><span class="text-[9px] uppercase tracking-widest">Memo</span>
                </button>
            </nav>
        </template>

        <div v-if="showItemModal || showExpenseModal || showNoteModal || showSettingsModal || showTravelerModal || showShoppingEditModal" class="modal-mask" @click.self="closeAllModals">
            <div class="modal-card">
                <h3 class="text-center text-lg font-serif font-bold text-theme-main mb-8 border-b border-gray-100 pb-4">{{ getModalTitle() }}</h3>
                
                <div v-if="showItemModal" class="space-y-6">
                    <input v-model="formItem.title" class="input-rounded text-center" placeholder="景點名稱">
                    <select v-model="formItem.dayIndex" class="input-rounded text-center bg-theme-input">
                        <option v-for="(day, idx) in days" :key="idx" :value="idx">Day {{ idx + 1 }} ({{ getDayDate(idx) }})</option>
                    </select>
                    <div class="flex items-center bg-theme-input rounded-3xl p-2 px-6">
                        <input v-model="tempHour" type="tel" maxlength="2" class="w-1/2 text-center bg-transparent py-2 text-xl font-bold" placeholder="09">
                        <span class="font-bold">:</span>
                        <input v-model="tempMinute" type="tel" maxlength="2" class="w-1/2 text-center bg-transparent py-2 text-xl font-bold" placeholder="00">
                    </div>
                    <textarea v-model="formItem.note" class="input-rounded resize-none h-32" placeholder="備註..."></textarea>
                    <button @click="saveItem" class="w-full py-4 bg-theme-accent text-white font-bold rounded-3xl shadow-lg">SAVE EVENT</button>
                </div>
                
                <div v-if="showExpenseModal" class="space-y-4">
                    <input v-model="formExpense.title" class="input-rounded text-center" placeholder="消費項目">
                    <div class="relative">
                        <span class="absolute left-6 top-1/2 -translate-y-1/2 font-bold">{{ currencySymbol }}</span>
                        <input v-model="formExpense.amount" type="number" class="input-rounded text-right pr-6 bg-theme-input h-14" placeholder="0">
                    </div>
                    <select v-model="formExpense.payer" class="input-rounded text-center bg-theme-input">
                        <option v-for="t in travelers" :value="t">{{t}} 付款</option>
                    </select>
                    <div class="flex bg-theme-input p-1 rounded-2xl">
                         <button @click="formExpense.type='shared'" :class="['mode-btn', formExpense.type==='shared'?'active':'']">共同</button>
                         <button @click="formExpense.type='individual'" :class="['mode-btn', formExpense.type==='individual'?'active':'']">自費/代墊</button>
                    </div>
                    <button @click="saveExpense" class="w-full py-4 bg-theme-accent text-white font-bold rounded-3xl shadow-lg">CONFIRM</button>
                </div>

                <div v-if="showSettingsModal" class="space-y-6">
                     <div><label class="input-label !ml-0 text-center block">Destination</label><input v-model="destination" class="input-rounded text-center"></div>
                     <button @click="exportPDF" class="w-full py-3 bg-theme-main text-white font-bold rounded-2xl shadow-md">EXPORT TO PDF</button>
                     <button @click="confirmResetData" class="w-full py-2 text-theme-danger text-[10px] tracking-widest opacity-60">RESET ALL CLOUD DATA</button>
                </div>
            </div>
        </div>

        <div v-if="confirmModal.show" class="modal-mask">
            <div class="bg-white w-72 p-6 text-center shadow-2xl rounded-3xl border border-gray-100">
                 <h3 class="font-serif font-bold text-theme-main mb-2 text-lg">{{ confirmModal.title }}</h3>
                 <p class="text-xs text-gray-500 mb-6 leading-relaxed">{{ confirmModal.message }}</p>
                 <div class="flex gap-3">
                     <button @click="confirmModal.show=false" class="flex-1 py-3 rounded-2xl text-theme-sub text-xs bg-gray-100">CANCEL</button>
                     <button @click="executeConfirm" class="flex-1 py-3 rounded-2xl bg-theme-accent text-white text-xs">CONFIRM</button>
                 </div>
            </div>
        </div>
    </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
