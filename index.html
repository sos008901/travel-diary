<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Travel Assistant (雲端版)</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#F4F2EE">

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Cinzel:wght@500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        display: ['"Cinzel"', '"Noto Serif TC"', 'serif'],
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        theme: { 
                            main: '#2C3032', sub: '#5F6368', accent: '#C5A059', bg: '#F4F2EE', white: '#FFFFFF', border: '#E0E0E0', danger: '#A65652', input: '#F0F2F2'
                        }
                    },
                    boxShadow: { float: '0 15px 30px -5px rgba(0, 0, 0, 0.1)', soft: '0 4px 20px -5px rgba(197, 160, 89, 0.15)', },
                    spacing: { 'safe-top': 'env(safe-area-inset-top)', 'safe-bottom': 'env(safe-area-inset-bottom)' },
                    borderRadius: { 'xl': '1rem', '2xl': '1.5rem', '3xl': '2rem', }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" v-cloak>
    <div id="app-container" class="bg-washi relative w-full h-full">
        
        <div class="cloud-status" :class="{ 'syncing': isSyncing, 'error': permissionError }">
            <template v-if="permissionError">
                 <i class="fas fa-exclamation-triangle"></i> <span>權限錯誤 (請檢查設定)</span>
            </template>
            <template v-else>
                 <i class="fas fa-cloud"></i> <span v-if="isSyncing">Syncing...</span>
            </template>
        </div>

        <div v-if="showWizard" class="fixed inset-0 z-[1500] bg-[#2C3032] overflow-y-auto text-white animate-fade-in no-scrollbar">
            <div class="min-h-full flex flex-col items-center justify-center p-6 relative z-10">
                <div class="w-full max-w-sm flex flex-col items-center">
                    <h1 class="text-6xl font-serif font-medium mb-8 tracking-widest text-white">栞</h1>
                    <div class="space-y-6 w-full px-4 text-center">
                        <input v-model="tempDestination" placeholder="Kyoto" class="w-full bg-transparent border-b border-gray-600 py-2 text-center text-xl font-serif text-white focus:border-theme-accent outline-none transition-colors" @input="detectCurrency">
                        <input type="date" v-model="tempStartDate" class="w-full bg-transparent border-b border-gray-600 py-2 text-center text-lg font-sans text-white outline-none">
                        <button @click="finishWizard" class="w-full py-4 mt-6 bg-theme-accent text-[#1A1C1C] font-bold rounded-xl active:scale-95 transition-all">START JOURNEY</button>
                    </div>
                </div>
            </div>
        </div>

        <template v-else>
            <header class="glass-panel pt-[calc(env(safe-area-inset-top)+40px)] px-6 pb-5 z-40 sticky top-0 flex justify-between items-end shadow-sm transition-all h-[calc(140px+env(safe-area-inset-top))] bg-[#F4F2EE]">
                <div class="flex-1 min-w-0 mr-4 relative pb-1">
                    <div class="pl-3 border-l-2 border-theme-accent/80 flex flex-col justify-end">
                        <p class="text-[10px] text-gray-400 font-sans font-bold uppercase tracking-[0.25em] mb-1.5 leading-none">Destination</p>
                        <h1 class="text-4xl font-serif font-medium tracking-widest text-theme-main leading-none overflow-visible whitespace-nowrap">{{ destination }}</h1>
                    </div>
                </div>
                <button @click="showSettingsModal = true" class="btn-base icon-btn mb-2 shrink-0 ml-4">
                    <i class="fas fa-cog"></i>
                </button>
            </header>

            <main class="flex-1 overflow-y-auto pb-40 relative bg-washi" @click="expandedItemId = null; expandedNoteId = null">
                
                <div v-if="currentTab === 'schedule'" class="p-5 min-h-full">
                    <div class="sticky top-0 z-30 py-3 -mx-5 px-5 bg-[#F4F2EE]/80 backdrop-blur-sm mb-6">
                        <div class="flex items-center justify-between">
                            <div ref="dateContainer" class="flex-1 overflow-x-auto no-scrollbar flex space-x-3 py-1 px-1">
                                <button v-for="(day, index) in days" :key="index" @click="currentDayIndex = index" 
                                    :class="['flex-shrink-0 px-5 py-3 border transition-all duration-300 flex flex-col items-center min-w-[6.5rem] rounded-3xl select-none', currentDayIndex === index ? 'bg-theme-main text-white border-theme-main shadow-lg' : 'bg-white text-theme-sub border-transparent shadow-sm']">
                                    <span class="text-[8px] font-display tracking-widest uppercase mb-1">Day {{ index + 1 }}</span>
                                    <span class="text-sm font-serif font-bold">{{ getDayDate(index) }}</span>
                                </button>
                            </div>
                            <div class="flex space-x-2 pl-3 border-l ml-2">
                                <button @click.stop="confirmDeleteDay" class="icon-btn-danger"><i class="fas fa-minus"></i></button>
                                <button @click.stop="addDay" class="icon-btn-primary"><i class="fas fa-plus"></i></button>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-5 pb-20">
                        <div v-for="(item, idx) in currentDayItems" :key="item.id" 
                            class="bg-white p-5 shadow-card border-l-4 border-theme-main relative group transition-all rounded-3xl flex items-start gap-1 select-none"
                            @click.stop="toggleExpand(item.id)">
                            
                            <div class="flex-1 min-w-0 py-1 transition-all">
                                <div class="flex justify-between items-start">
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-baseline mb-1">
                                            <span class="text-xs font-display font-bold text-theme-accent mr-3">{{ item.time }}</span>
                                            <h3 class="text-lg font-serif font-bold text-theme-main tracking-wide">{{ item.title }}</h3>
                                        </div>
                                        <div v-if="item.location" class="flex items-center text-xs text-gray-500 font-sans cursor-pointer hover:text-theme-accent transition" @click.stop="openMap(item.location)">
                                            <i class="fas fa-map-marker-alt mr-1.5"></i><span class="truncate underline decoration-dotted">{{ item.location }}</span>
                                        </div>
                                    </div>
                                    <button @click.stop="confirmDeleteItem(item.id)" class="text-gray-300 hover:text-theme-danger p-2"><i class="fas fa-times"></i></button>
                                </div>
                                <div v-if="expandedItemId === item.id && item.note" class="mt-4 pt-3 border-t border-dashed border-gray-200 text-sm text-gray-600 font-sans leading-relaxed whitespace-pre-wrap" v-html="renderNote(item.note)"></div>
                            </div>
                            <button @click.stop="editItem(item)" class="absolute right-4 bottom-4 w-8 h-8 bg-gray-50 rounded-full flex items-center justify-center text-gray-400 hover:text-theme-accent hover:bg-white shadow-sm opacity-0 group-hover:opacity-100 transition"><i class="fas fa-pen text-xs"></i></button>
                        </div>
                    </div>
                </div>

                <div v-if="currentTab === 'money'" class="p-5">
                    <div class="bg-theme-main text-white p-8 rounded-3xl shadow-xl mb-8 text-center relative overflow-hidden">
                        <p class="text-[10px] tracking-[0.4em] text-theme-accent uppercase mb-4">Grand Total</p>
                        <h2 class="text-5xl font-serif mb-2">{{ currencySymbol }} {{ totalExpense.toLocaleString() }}</h2>
                        <p class="text-xs opacity-60">≈ NT$ {{ toTWD(totalExpense) }}</p>
                    </div>
                    </div>

                <div v-if="currentTab === 'memo'" class="p-6">
                    <h2 class="text-2xl font-serif font-bold text-theme-main mb-6 tracking-widest border-b pb-4">備忘錄 & 購物清單</h2>
                    
                    <div class="flex gap-2 mb-6">
                        <input v-model="newShopName" @keyup.enter="addShop" placeholder="新增店家名稱..." class="input-rounded !py-3 flex-1">
                        <button @click="addShop" class="bg-theme-main text-white w-12 rounded-2xl flex items-center justify-center active:scale-95 transition-transform"><i class="fas fa-store"></i></button>
                    </div>

                    <div class="space-y-6 pb-20">
                        <div v-for="shop in shoppingList" :key="shop.id" class="bg-white rounded-3xl shadow-sm overflow-hidden">
                             <div class="bg-theme-input/50 px-5 py-3 flex justify-between items-center border-b border-gray-100" @click="toggleShop(shop)">
                                 <h3 class="font-bold text-theme-main font-serif">{{ shop.shopName }}</h3>
                                 <button @click.stop="removeShop(shop.id)" class="text-gray-300 hover:text-theme-danger p-1 text-xs">刪除店家</button>
                             </div>
                             <div class="p-4" v-show="shop.expanded">
                                 <div v-for="item in shop.items" :key="item.id" class="flex items-center justify-between p-2">
                                     <div class="flex items-center gap-3 cursor-pointer" @click="toggleItem(shop.id, item)">
                                         <div :class="['w-5 h-5 rounded border flex items-center justify-center', item.done ? 'bg-theme-accent border-theme-accent' : 'border-gray-300']">
                                             <i v-if="item.done" class="fas fa-check text-white text-[10px]"></i>
                                         </div>
                                         <span :class="item.done ? 'text-gray-300 line-through' : 'text-theme-main'">{{ item.text }}</span>
                                     </div>
                                     <button @click="removeItem(shop.id, item.id)" class="text-gray-200 hover:text-theme-danger"><i class="fas fa-times"></i></button>
                                 </div>
                                 <div class="flex gap-2 mt-3">
                                     <input v-model="shop.tempItemInput" @keyup.enter="addItemToShop(shop)" placeholder="新增商品..." class="flex-1 bg-gray-50 px-4 py-2 rounded-xl text-sm outline-none">
                                     <button @click="addItemToShop(shop)" class="bg-theme-main text-white px-4 rounded-xl shadow-md"><i class="fas fa-plus"></i></button>
                                 </div>
                             </div>
                        </div>
                    </div>
                </div>
            </main>

            <nav class="glass-panel absolute bottom-0 w-full h-[calc(80px+env(safe-area-inset-bottom))] pb-safe-bottom z-[900] flex justify-around items-center">
                <button @click="currentTab='schedule'" :class="['flex flex-col items-center flex-1', currentTab==='schedule'?'text-theme-accent':'text-theme-sub']">
                    <i class="fas fa-map-marked-alt text-xl mb-1"></i><span class="text-[9px] uppercase tracking-widest">Schedule</span>
                </button>
                <button @click="currentTab='money'" :class="['flex flex-col items-center flex-1', currentTab==='money'?'text-theme-accent':'text-theme-sub']">
                    <i class="fas fa-wallet text-xl mb-1"></i><span class="text-[9px] uppercase tracking-widest">Budget</span>
                </button>
                <button @click="currentTab='memo'" :class="['flex flex-col items-center flex-1', currentTab==='memo'?'text-theme-accent':'text-theme-sub']">
                    <i class="fas fa-book text-xl mb-1"></i><span class="text-[9px] uppercase tracking-widest">Memo</span>
                </button>
            </nav>
        </template>

        <div v-if="showItemModal || showExpenseModal || showNoteModal || showSettingsModal || showTravelerModal || showShoppingEditModal" class="modal-mask" @click.self="closeAllModals">
            <div class="modal-card">
                <h3 class="text-center text-lg font-serif font-bold text-theme-main mb-8 border-b border-gray-100 pb-4">{{ getModalTitle() }}</h3>
                
                <div v-if="showItemModal" class="space-y-6">
                    <input v-model="formItem.title" class="input-rounded text-center" placeholder="景點名稱">
                    <div class="flex flex-col gap-1.5">
                        <select v-model="formItem.dayIndex" class="input-rounded text-center bg-theme-input outline-none">
                            <option v-for="(day, idx) in days" :key="idx" :value="idx">Day {{ idx + 1 }} ({{ getDayDate(idx) }})</option>
                        </select>
                    </div>
                    <div class="flex items-center bg-theme-input rounded-3xl p-2 px-6">
                        <input v-model="tempHour" type="tel" maxlength="2" class="w-1/2 text-center bg-transparent py-2 text-xl font-bold outline-none" placeholder="09">
                        <span class="font-bold">:</span>
                        <input v-model="tempMinute" type="tel" maxlength="2" class="w-1/2 text-center bg-transparent py-2 text-xl font-bold outline-none" placeholder="00">
                    </div>
                    <textarea v-model="formItem.note" class="input-rounded resize-none h-32 leading-relaxed" placeholder="寫下備註..."></textarea>
                    <button @click="saveItem" class="w-full py-4 bg-theme-accent text-white font-bold rounded-3xl shadow-lg active:scale-[0.98] transition-transform">SAVE EVENT</button>
                </div>

                <div v-if="showExpenseModal" class="space-y-4">
                     <input v-model="formExpense.title" class="input-rounded text-center" placeholder="消費項目">
                     <div class="relative">
                         <span class="absolute left-6 top-1/2 -translate-y-1/2 font-bold">{{ currencySymbol }}</span>
                         <input v-model="formExpense.amount" type="number" class="input-rounded text-right pr-6 bg-theme-input h-14" placeholder="0">
                     </div>
                     <button @click="saveExpense" class="w-full py-4 bg-theme-accent text-white font-bold rounded-3xl shadow-lg active:scale-[0.98] transition-transform">CONFIRM</button>
                </div>

                <div v-if="showSettingsModal" class="space-y-6 text-center">
                    <button @click="exportPDF" class="w-full py-3 bg-theme-main text-white font-bold rounded-2xl shadow-md transition-transform active:scale-[0.98] mb-4">EXPORT TO PDF</button>
                    <button @click="confirmResetData" class="w-full py-2 text-theme-danger text-[10px] tracking-widest opacity-60 hover:opacity-100 rounded-2xl">RESET ALL CLOUD DATA</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
